name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS xcworkspace
        run: flutter build ios --config-only --no-codesign

      - name: Build with Xcode (No Signing)
        run: |
          cd ios
          pod install
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r ios/build_output/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -r Hissou.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Hissou-iOS-IPA
          path: Hissou.ipa
